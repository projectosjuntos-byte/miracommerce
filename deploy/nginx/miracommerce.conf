upstream miracommerce_app {
    server unix:/run/miracommerce/gunicorn.sock fail_timeout=0;
}

server {
    listen 80;
    server_name shop.example.ao www.shop.example.ao;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name shop.example.ao www.shop.example.ao;

    ssl_certificate /etc/letsencrypt/live/shop.example.ao/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shop.example.ao/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10M;

    location /static/ {
        alias /srv/miracommerce/staticfiles/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /srv/miracommerce/media/;
        expires 1d;
        add_header Cache-Control "private, max-age=86400";
    }

    location / {
        proxy_pass http://miracommerce_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Não propague um X-Forwarded-For fornecido pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
